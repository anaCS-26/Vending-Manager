name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same ref makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`, and deliberately so. package-lock.json is
      # generated on Windows, so the only platform-gated binaries it records are
      # win32 (rolldown, @next/swc, lightningcss, oxide, unrs-resolver, esbuild,
      # sharp). `npm ci` installs the lockfile verbatim and vitest then dies on a
      # missing @rolldown/binding-linux-x64-gnu — npm/cli#4828.
      #
      # `npm install` honours every locked version and additionally resolves the
      # right native binaries for this platform. Verified: with this lockfile
      # present it reports zero version drift across all 58 direct dependencies,
      # so the pinning a gate needs is intact. It is also what Vercel runs, so CI
      # matches the deploy.
      #
      # The real fix is to generate package-lock.json on Linux (a WSL or Docker
      # `npm install`), after which this can go back to `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # npm resolves a package's optional deps once, at lockfile-generation time,
      # and honours that record on install — so `npm install` does not heal the
      # gap either. vitest 4 bundles with rolldown, whose native binding is an
      # optional dep, and the lockfile only carries the win32 one.
      #
      # Install just that binding, at whatever version the resolved rolldown
      # actually wants, so this cannot drift when vitest is upgraded. --no-save
      # keeps it out of the lockfile: it is a CI-host concern, not a project
      # dependency. Goes away once the lockfile is generated on Linux.
      - name: Install rolldown's Linux binding (npm/cli#4828)
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('rolldown/package.json').version")"
          echo "rolldown resolved to $VERSION"
          npm install --no-save --no-audit --no-fund \
            "@rolldown/binding-linux-x64-gnu@${VERSION}"

      # src/types/index.ts is built almost entirely on Prisma.<Model>GetPayload<...>,
      # so the generated client has to exist before anything type-checks. There is
      # no postinstall hook that does this. `generate` only reads schema.prisma and
      # never opens a connection, but Prisma still insists the datasource env vars
      # resolve — hence the throwaway values below. They point at nothing.
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      # Each check runs even if an earlier one failed, so a single run reports
      # everything that's wrong instead of making you fix them one per push.
      - name: Type check
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      # Fails on eslint errors. Warnings are printed but do not block — there are
      # 2 known `<img>` warnings that need a next/image migration to clear.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # No database needed: vitest.setup.ts mocks @/lib/prisma globally, along
      # with next-auth, next/headers, next/cache and the blob/redis clients.
      - name: Tests
        if: ${{ !cancelled() }}
        run: npx vitest run
