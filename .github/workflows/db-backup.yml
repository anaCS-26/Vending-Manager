name: Supabase Database Backup

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL Tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create Database Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Create a dynamic filename with the current date
          BACKUP_FILE="db_backup_$(date +'%Y_%m_%d_%H%M%S').sql"
          
          echo "Starting pg_dump..."
          
          # We use the clean (-c) flag so the restoration drops old tables before creating new ones
          pg_dump "$SUPABASE_DB_URL" -c -F p | gzip > $BACKUP_FILE.gz
          
          echo "Database successfully dumped and compressed to $BACKUP_FILE.gz"
          
          # Pass the variables to subsequent steps
          echo "BACKUP_FILE=$BACKUP_FILE.gz" >> $GITHUB_ENV

      - name: Upload to Supabase S3 Storage Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_BACKUP_BUCKET: ${{ secrets.SUPABASE_BACKUP_BUCKET }}
        run: |
          aws s3 cp $BACKUP_FILE s3://$SUPABASE_BACKUP_BUCKET/$BACKUP_FILE \
            --endpoint-url $SUPABASE_S3_ENDPOINT \
            --region us-east-1
          
          echo "Successfully uploaded $BACKUP_FILE to Supabase Storage!"
